server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The router lives in the browser, so nginx must hand every unknown path to
    # index.html instead of answering 404 (e.g. a refresh on /InformationForm).
    location / {
        try_files $uri $uri/ /index.html;
        # index.html itself must never be cached, otherwise the browser keeps
        # loading the previous build's asset names after a new deploy.
        add_header Cache-Control "no-cache";
    }

    # Built files carry a content hash in their name, so they can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
